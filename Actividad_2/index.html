<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slow Animated y = x² Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
</head>
<body>
    <div id="controls">
        <div id="functions">
            <button>x3 + 4x2 -10</button>
            <button>x3 - 2x2 - 5 </button>
            <button>x3 + 3x2 - 1</button>
            <button>x - cos(x)</button>
            <button>ex + 2-x + 2cos(x) - 6 </button>
        </div>
        <div id="methods">
            <button>Bisección</button>
            <button>Newton Raphson</button>
            <button>Secante</button>
            <button>Punto Fijo</button>
            <button>Regla Falsa</button>
            <button>Regla Falsa M</button>
        </div>
        <div id="parameters">
            <div id="cont-inter">
                <span style="padding-bottom: 5px;"> intervalo [ a , b ] </span>
                <input id="ainput" class="inter" type="text" placeholder="[a">
                <input id="binput" class="inter" type="text" placeholder="b]">
            </div>

            <div id="cont-points">
                <span style="padding-bottom: 5px;"> Puntos iniciales </span>
                <input id="b0" class="inter" type="text" placeholder="b0">
                <input id="b1" class="inter" type="text" placeholder="b1">
            </div>

            <input id="tol" class="inter" type="text" placeholder="tolerancia">
            <input id="miter" class="inter" type="text" placeholder="iteraciones maximas">

        </div>
        <button id="anim">animate</button>
    </div>

    <div style="width: 70%; margin: auto; ">
        <canvas id="myChart"></canvas>
        <script  type="module" src="main.js"></script>
    </div>

    <div>Tabla</div>


</body>
</html>
